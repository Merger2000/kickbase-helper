<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Kickbase Helper{% endblock %}</title>
  <meta name="theme-color" content="#0f1d18" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f1f5f0" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kickbase">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "timeout": 90000, "reportValidityOfForms": true}'>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{{ static_url('icons/icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ static_url('icons/apple-touch-icon.png') }}">
  <link rel="preload" href="/static/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
  <script src="{{ static_url('vendor/htmx.min.js') }}" defer></script>
  <script src="{{ static_url('js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}
</body>
</html>
