# Updates come grouped once a week, so there are only a few PRs.
# `cooldown` waits a week after a release before proposing it (protects against hijacked
# releases that are pulled again soon after publishing).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/docker, /docker/caddy]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      images:
        patterns: ["*"]
    ignore:
      # The project is pinned to Python 3.12 (pyproject: requires-python <3.13).
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
